# Use H2 in-memory database for tests (no PostgreSQL needed)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Use Hibernate to auto-create schema from entities
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable Eureka registration
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Disable OpenTelemetry export
management.tracing.enabled=false
management.otlp.metrics.export.enabled=false

# Disable Resilience4j health indicators (not needed in tests)
management.health.circuitbreakers.enabled=false
