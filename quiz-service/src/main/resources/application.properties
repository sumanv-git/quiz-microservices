spring.application.name=quiz-service

server.port=9042
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:9032/quizdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:dev}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:dev}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE:http://localhost:8761/eureka/}
# Local environment
eureka.instance.hostname=localhost
eureka.instance.ip-address=127.0.0.1
eureka.instance.prefer-ip-address=false

# OpenTelemetry Tracing Configuration
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
# Disable OTLP metrics export for local runs unless an OpenTelemetry Collector is running on localhost:4318
management.otlp.metrics.export.enabled=false
spring.jpa.properties.hibernate.generate_statistics=false
spring.cloud.openfeign.micrometer.enabled=true

# Enable Resilience4j circuit breaker for Feign
spring.cloud.openfeign.circuitbreaker.enabled=true
management.health.circuitbreakers.enabled=true
management.endpoint.health.show-details=always
management.endpoint.health.status.order=DOWN,OUT_OF_SERVICE,OPEN,HALF_OPEN,UNKNOWN,UP

# Resilience4j Circuit Breaker - question-service feign calls
resilience4j.circuitbreaker.instances.QUESTION-SERVICE.sliding-window-size=10
resilience4j.circuitbreaker.instances.QUESTION-SERVICE.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.QUESTION-SERVICE.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.QUESTION-SERVICE.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.QUESTION-SERVICE.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.QUESTION-SERVICE.register-health-indicator=true
resilience4j.timelimiter.instances.QUESTION-SERVICE.timeout-duration=5s