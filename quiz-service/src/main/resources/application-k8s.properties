spring.application.name=quiz-service
server.port=9042
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://pgsql-dev:5432/quizdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:dev}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:dev}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE:http://eureka:8761/eureka/}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:quiz-service}
eureka.instance.ip-address=${EUREKA_INSTANCE_IP_ADDRESS:quiz-service}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP_ADDRESS:true}
eureka.instance.non-secure-port=9042
