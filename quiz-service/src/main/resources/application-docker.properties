spring.application.name=quiz-service
server.port=9042
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-dev:5432/quizdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:dev}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:dev}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE:http://service-registry:8761/eureka/}
# Docker environment - use container name for service discovery
eureka.instance.hostname=quiz-service
eureka.instance.ip-address=quiz-service
eureka.instance.prefer-ip-address=true
eureka.instance.non-secure-port=9042
