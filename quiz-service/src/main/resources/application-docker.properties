spring.application.name=quiz-service
server.port=9042
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-dev:5432/quizdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:dev}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:dev}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE:http://service-registry:8761/eureka/}
# Docker environment - use container name for service discovery
eureka.instance.hostname=quiz-service
eureka.instance.ip-address=quiz-service
eureka.instance.prefer-ip-address=true
eureka.instance.non-secure-port=9042

# OpenTelemetry Configuration
management.tracing.jaeger.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.web.exposure.exclude=
management.metrics.export.otlp.enabled=true
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
management.tracing.sampling.probability=1.0
spring.jpa.properties.hibernate.generate_statistics=false

# Enable Resilience4j circuit breaker for Feign
spring.cloud.openfeign.circuitbreaker.enabled=true
management.health.circuitbreakers.enabled=true
management.endpoint.health.show-details=always
management.endpoint.health.status.order=DOWN,OUT_OF_SERVICE,OPEN,HALF_OPEN,UNKNOWN,UP

# Resilience4j Circuit Breaker - question-service feign calls
resilience4j.circuitbreaker.instances.QUESTION-SERVICE.sliding-window-size=10
resilience4j.circuitbreaker.instances.QUESTION-SERVICE.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.QUESTION-SERVICE.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.QUESTION-SERVICE.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.QUESTION-SERVICE.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.QUESTION-SERVICE.register-health-indicator=true
resilience4j.timelimiter.instances.QUESTION-SERVICE.timeout-duration=5s
