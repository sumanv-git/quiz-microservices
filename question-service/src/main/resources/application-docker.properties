spring.application.name=question-service
server.port=9041
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-dev:5432/qustiondb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:dev}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:dev}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE:http://service-registry:8761/eureka/}
# Docker environment - use container name for service discovery
eureka.instance.hostname=question-service
eureka.instance.ip-address=question-service
eureka.instance.prefer-ip-address=true
eureka.instance.non-secure-port=9041

# OpenTelemetry Configuration
management.tracing.jaeger.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.web.exposure.exclude=
management.metrics.export.otlp.enabled=true
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
management.tracing.sampling.probability=1.0
spring.jpa.properties.hibernate.generate_statistics=false
