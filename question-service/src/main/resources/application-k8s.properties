spring.application.name=question-service
server.port=9041
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-service:5432/qustiondb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:dev}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:dev}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE:http://service-registry:8761/eureka/}
# Kubernetes environment - use K8s DNS
eureka.instance.hostname=question-service.default.svc.cluster.local
eureka.instance.ip-address=question-service.default.svc.cluster.local
eureka.instance.prefer-ip-address=false
eureka.instance.non-secure-port=9041
eureka.instance.instance-id=${spring.application.name}:${random.value}
