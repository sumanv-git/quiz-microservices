spring.application.name=api-gateway
server.port=8765

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE:http://eureka:8761/eureka/}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:api-gateway}
eureka.instance.ip-address=${EUREKA_INSTANCE_IP_ADDRESS:api-gateway}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP_ADDRESS:true}
eureka.instance.non-secure-port=8765
