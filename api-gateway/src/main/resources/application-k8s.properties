spring.application.name=api-gateway
server.port=8765

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE:http://service-registry:8761/eureka/}
# Kubernetes environment - use K8s DNS
eureka.instance.hostname=api-gateway.default.svc.cluster.local
eureka.instance.ip-address=api-gateway.default.svc.cluster.local
eureka.instance.prefer-ip-address=false
eureka.instance.non-secure-port=8765
eureka.instance.instance-id=${spring.application.name}:${random.value}
