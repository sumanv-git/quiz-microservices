spring.application.name=api-gateway
server.port=8765

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE:http://service-registry:8761/eureka/}
# Docker environment - use container name for service discovery
eureka.instance.hostname=api-gateway
eureka.instance.ip-address=api-gateway
eureka.instance.prefer-ip-address=true
eureka.instance.non-secure-port=8765

# OpenTelemetry Tracing Configuration
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
management.endpoints.web.exposure.include=health,info,metrics,prometheus,circuitbreakers
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
management.endpoint.health.status.order=DOWN,OUT_OF_SERVICE,OPEN,HALF_OPEN,UNKNOWN,UP

# Resilience4j Circuit Breaker - question-service
resilience4j.circuitbreaker.instances.question-service-cb.sliding-window-size=10
resilience4j.circuitbreaker.instances.question-service-cb.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.question-service-cb.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.question-service-cb.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.question-service-cb.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.question-service-cb.register-health-indicator=true

# Resilience4j Circuit Breaker - quiz-service
resilience4j.circuitbreaker.instances.quiz-service-cb.sliding-window-size=10
resilience4j.circuitbreaker.instances.quiz-service-cb.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.quiz-service-cb.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.quiz-service-cb.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.quiz-service-cb.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.quiz-service-cb.register-health-indicator=true

# Resilience4j TimeLimiter (timeout per request)
resilience4j.timelimiter.instances.question-service-cb.timeout-duration=5s
resilience4j.timelimiter.instances.quiz-service-cb.timeout-duration=5s
