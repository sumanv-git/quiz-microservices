spring.application.name=api-gateway
server.port=8765

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE:http://service-registry:8761/eureka/}
# Docker environment - use container name for service discovery
eureka.instance.hostname=api-gateway
eureka.instance.ip-address=api-gateway
eureka.instance.prefer-ip-address=true
eureka.instance.non-secure-port=8765
