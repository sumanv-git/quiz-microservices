apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-gateway-app
spec:
  selector:
    matchLabels:
      app: cloud-gateway-app
  template:
    metadata:
      labels:
        app: cloud-gateway-app
    spec:
      containers:
      - name: cloud-gateway-app
        image: quizapp/api-gateway:0.0.1
        ports:
        - containerPort: 8765
        env:
          - name: EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE
            valueFrom:
              configMapKeyRef:
                key: eureka-service-address
                name: eureka-cm

---

apiVersion: v1
kind: Service
metadata:
  name: cloud-gateway-svc
spec:
  type: LoadBalancer
  selector:
    app: cloud-gateway-app
  ports:
  - port: 80
    targetPort: 8765

